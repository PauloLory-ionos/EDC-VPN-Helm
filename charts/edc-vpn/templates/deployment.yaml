apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edc-vpn.fullname" . }}
  labels:
    {{- include "edc-vpn.labels" . | nindent 4 }}
spec:
  # In-memory stores: never more than one replica
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "edc-vpn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "edc-vpn.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: edc
          image: {{ include "edc-vpn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: JAVA_OPTS
              value: {{ printf "-Dedc.fs.config=/config/config.properties %s" .Values.javaOpts | trim | quote }}
            - name: EDC_HOSTNAME
              value: {{ .Values.hostname | default (include "edc-vpn.serviceHost" .) | quote }}
            {{- with .Values.apiKey }}
            {{- if .secretName }}
            - name: EDC_API_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- else if .value }}
            - name: EDC_API_AUTH_KEY
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.infrastructure.defaultAuthToken }}
            {{- if .secretName }}
            - name: EDC_INFRASTRUCTURE_SIMPL_DEFAULT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- range $name, $port := .Values.ports }}
            - name: {{ include "edc-vpn.portName" $name }}
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: edc-management
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: edc-management
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "edc-vpn.fullname" . }}-config
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
