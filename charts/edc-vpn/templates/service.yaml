apiVersion: v1
kind: Service
metadata:
  name: {{ include "edc-vpn.fullname" . }}
  labels:
    {{- include "edc-vpn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "edc-vpn.selectorLabels" . | nindent 4 }}
  ports:
    {{- range .Values.service.expose }}
    - name: {{ . }}
      port: {{ required (printf "ports.%s is not defined" .) (index $.Values.ports .) }}
      targetPort: {{ include "edc-vpn.portName" . }}
      protocol: TCP
    {{- end }}
